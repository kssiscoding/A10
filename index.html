
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Demonstration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            text-align: center;
            padding: 50px;
        }

        .container {
            background: white;
            padding: 30px;
            max-width: 500px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 2px 10px #cccccc;
        }

        h1 {
            color: #24527a;
        }

        #cookieDisplay {
            background-color: #e2f0d9;
            padding: 15px;
            margin-top: 20px;
            border-radius: 5px;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>My Cookie Demonstration</h1>

        <p>This webpage uses JavaScript to create and read a cookie.</p>

        <div id="cookieDisplay">
            Loading cookie information...
        </div>

        <p>Reload the page to see the saved cookie!</p>
    </div>

    <script>
        function setCookie(cname, cvalue, exdays) {
            const d = new Date();
            d.setTime(d.getTime() + (exdays*24*60*60*1000));
            let expires = "expires="+ d.toUTCString();
            document.cookie = cname + "=" + cvalue + ";" + expires + ";path=/";
        }
        function getCookie(cname) {
            let name = cname + "=";
            let decodedCookie = decodeURIComponent(document.cookie);
            let ca = decodedCookie.split(';');

            for(let i = 0; i <ca.length; i++) {
                let c = ca[i];

                while (c.charAt(0) == ' ') {
                    c = c.substring(1);
                }

                if (c.indexOf(name) == 0) {
                    return c.substring(name.length, c.length);
                }
            }

            return "";
        }
        function checkCookie() {
            let username = getCookie("username");

            if (username != "") {
                document.getElementById("cookieDisplay").textContent =
                    "Welcome back, " + username +
                    "! Your cookie has been saved.";
            } else {
                username = prompt("Please enter your name:", "");

                if (username != "" && username != null) {
                    setCookie("username", username, 365);

                    document.getElementById("cookieDisplay").textContent =
                        "Hello, " + username +
                        "! Your cookie has been created. Reload the page to see it.";
                } else {
                    document.getElementById("cookieDisplay").textContent =
                        "No cookie was created.";
                }
            }
        }

        checkCookie();

    </script>
    <footer>
        <p>&copy; Kumpal Shah, 11/11/2026 A10</p>
    </footer>

</body>
</html>
